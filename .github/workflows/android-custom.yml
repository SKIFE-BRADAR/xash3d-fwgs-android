name: Android custom build

on:
  push:
    branches: [ main, master, custom ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: '9.0'
      GH_CPU_ARCH: arm64
      GH_CPU_OS: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: bash scripts/gha/deps_android.sh

      - name: Build engine
        run: bash scripts/gha/build_android.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUM=$(( ( $(date +%s) - $(date -u -d '2015-04-01' +%s) ) / 86400 ))
          NOTES="buildnum ${BUILD_NUM}

          Xash3D FWGS engine with the Android 17 GLES1 startup crash fix, MSAA (-msaa), preset and custom exact render resolution (for example 860x605), and OpenGL error console spam suppression. arm64-v8a only."
          if gh release view continuous >/dev/null 2>&1; then
            gh release upload continuous artifacts/xash3d-fwgs-android.apk --clobber
            gh release edit continuous --notes "$NOTES"
          else
            gh release create continuous artifacts/xash3d-fwgs-android.apk \
              --prerelease \
              --title "Custom Android engine build" \
              --notes "$NOTES"
          fi
